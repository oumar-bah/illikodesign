<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060a"/>
      <stop offset="100%" stop-color="#080a12"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BF953F"/>
      <stop offset="50%" stop-color="#FCF6BA"/>
      <stop offset="100%" stop-color="#B38728"/>
    </linearGradient>
    <linearGradient id="car-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a24"/>
      <stop offset="100%" stop-color="#0d0d18"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BF953F" stop-opacity="0"/>
      <stop offset="30%" stop-color="#FCF6BA" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#BF953F" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#B38728" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <!-- Road -->
  <rect x="0" y="560" width="1200" height="240" fill="#0a0a0f"/>
  <rect x="0" y="558" width="1200" height="4" fill="url(#gold)" fill-opacity="0.15"/>
  <!-- Road markings -->
  <g fill="url(#gold)" fill-opacity="0.08">
    <rect x="100" y="620" width="120" height="8" rx="4"/>
    <rect x="320" y="620" width="120" height="8" rx="4"/>
    <rect x="540" y="620" width="120" height="8" rx="4"/>
    <rect x="760" y="620" width="120" height="8" rx="4"/>
    <rect x="980" y="620" width="120" height="8" rx="4"/>
  </g>
  <!-- Vehicle body - side view simplified -->
  <!-- Main body -->
  <path d="M150,420 Q160,360 280,340 L380,320 Q480,300 600,300 L800,300 Q900,300 960,320 Q1020,340 1040,380 L1060,420 L1060,520 Q1060,540 1040,540 L160,540 Q140,540 140,520 Z" fill="url(#car-body)" stroke="#2a2a3a" stroke-width="2"/>
  <!-- Gold wrap stripe -->
  <path d="M200,420 Q210,370 300,355 L900,355 Q980,355 1000,395 L1000,430 L200,430 Z" fill="url(#stripe)" fill-opacity="0.5"/>
  <!-- Windows -->
  <path d="M350,340 L330,400 L500,400 L510,340 Z" fill="#0d1020" stroke="#1a1a30" stroke-width="1.5"/>
  <path d="M520,338 L516,400 L700,400 L706,338 Z" fill="#0d1020" stroke="#1a1a30" stroke-width="1.5"/>
  <path d="M716,340 L712,400 L850,400 L870,344 Z" fill="#0d1020" stroke="#1a1a30" stroke-width="1.5"/>
  <!-- Wheels -->
  <circle cx="310" cy="540" r="80" fill="#0d0d15" stroke="#1a1a25" stroke-width="3"/>
  <circle cx="310" cy="540" r="55" fill="#080810" stroke="url(#gold)" stroke-width="1.5"/>
  <circle cx="310" cy="540" r="20" fill="#1a1a25"/>
  <circle cx="880" cy="540" r="80" fill="#0d0d15" stroke="#1a1a25" stroke-width="3"/>
  <circle cx="880" cy="540" r="55" fill="#080810" stroke="url(#gold)" stroke-width="1.5"/>
  <circle cx="880" cy="540" r="20" fill="#1a1a25"/>
  <!-- Logo on vehicle -->
  <text x="600" y="395" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-style="italic" fill="url(#gold)" fill-opacity="0.9" letter-spacing="3">ILLIKO DESIGN</text>
  <!-- Label -->
  <text x="600" y="700" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#D4AF37" fill-opacity="0.5" letter-spacing="5">MARQUAGE VÉHICULES · HABILLAGE · VITROPHANIE</text>
</svg>