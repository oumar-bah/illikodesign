<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BF953F"/>
      <stop offset="50%" stop-color="#FCF6BA"/>
      <stop offset="100%" stop-color="#B38728"/>
    </linearGradient>
    <linearGradient id="print-head" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f0f"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <!-- Printer body -->
  <rect x="100" y="200" width="1000" height="80" rx="8" fill="url(#print-head)" stroke="#2a2a2a" stroke-width="2"/>
  <!-- Rail -->
  <rect x="100" y="230" width="1000" height="12" rx="6" fill="#151515"/>
  <!-- Print head on rail -->
  <rect x="480" y="218" width="100" height="44" rx="4" fill="#1f1f1f" stroke="url(#gold)" stroke-width="1.5"/>
  <rect x="510" y="232" width="40" height="16" rx="2" fill="url(#gold)" fill-opacity="0.8"/>
  <!-- Paper coming out -->
  <rect x="100" y="280" width="1000" height="320" rx="0" fill="url(#paper)" stroke="#1a1a1a" stroke-width="1"/>
  <!-- Printed image stripes - simulating print progress -->
  <rect x="100" y="280" width="1000" height="60" fill="#0f0f10"/>
  <rect x="100" y="340" width="1000" height="8" fill="url(#gold)" fill-opacity="0.3"/>
  <rect x="100" y="348" width="1000" height="40" fill="#100f0a"/>
  <rect x="100" y="388" width="1000" height="6" fill="url(#gold)" fill-opacity="0.2"/>
  <rect x="100" y="394" width="1000" height="50" fill="#0f100d"/>
  <!-- Partial printed content -->
  <text x="600" y="440" text-anchor="middle" font-family="Georgia, serif" font-size="48" font-style="italic" fill="url(#gold)" fill-opacity="0.4">Grand Format</text>
  <!-- Ink cartridges -->
  <g>
    <rect x="120" y="210" width="14" height="28" rx="3" fill="#C41E3A" fill-opacity="0.8"/>
    <rect x="142" y="210" width="14" height="28" rx="3" fill="#1E78C4" fill-opacity="0.8"/>
    <rect x="164" y="210" width="14" height="28" rx="3" fill="#F0E010" fill-opacity="0.8"/>
    <rect x="186" y="210" width="14" height="28" rx="3" fill="#1a1a1a" stroke="#444" stroke-width="1"/>
  </g>
  <!-- Side supports -->
  <rect x="80" y="200" width="24" height="400" rx="4" fill="#111111" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="1096" y="200" width="24" height="400" rx="4" fill="#111111" stroke="#1a1a1a" stroke-width="1"/>
  <!-- Label -->
  <text x="600" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#D4AF37" fill-opacity="0.5" letter-spacing="5">IMPRESSION GRAND FORMAT · NUMÉRIQUE · AFFICHES</text>
</svg>