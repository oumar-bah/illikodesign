<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="60%" stop-color="#0d0a06"/>
      <stop offset="100%" stop-color="#1a1206"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BF953F"/>
      <stop offset="45%" stop-color="#FCF6BA"/>
      <stop offset="75%" stop-color="#B38728"/>
      <stop offset="100%" stop-color="#FBF5B7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#center-glow)"/>
  <!-- Grid lines -->
  <g stroke="#D4AF37" stroke-opacity="0.06" stroke-width="1">
    <line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="800" y1="0" x2="800" y2="800"/>
    <line x1="1000" y1="0" x2="1000" y2="800"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="640" x2="1200" y2="640"/>
  </g>
  <!-- Large print press silhouette -->
  <rect x="120" y="280" width="960" height="8" rx="4" fill="url(#gold)" fill-opacity="0.3"/>
  <rect x="180" y="320" width="840" height="6" rx="3" fill="url(#gold)" fill-opacity="0.2"/>
  <rect x="240" y="356" width="720" height="4" rx="2" fill="url(#gold)" fill-opacity="0.15"/>
  <!-- Central diamond mark -->
  <g transform="translate(600,400)">
    <polygon points="0,-80 70,0 0,80 -70,0" fill="none" stroke="url(#gold)" stroke-width="1.5" filter="url(#glow)"/>
    <polygon points="0,-50 44,0 0,50 -44,0" fill="none" stroke="url(#gold)" stroke-width="0.8" stroke-opacity="0.5"/>
    <circle cx="0" cy="0" r="12" fill="url(#gold)"/>
    <circle cx="0" cy="0" r="6" fill="#050505"/>
  </g>
  <!-- Corner decorative marks -->
  <g stroke="url(#gold)" stroke-width="1.5" fill="none" stroke-opacity="0.6">
    <path d="M80,80 L80,40 L120,40"/>
    <path d="M1120,80 L1120,40 L1080,40"/>
    <path d="M80,720 L80,760 L120,760"/>
    <path d="M1120,720 L1120,760 L1080,760"/>
  </g>
  <!-- Company label area -->
  <text x="600" y="530" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#D4AF37" fill-opacity="0.7" letter-spacing="6">ILLIKO DESIGN · IMPRIMERIE PREMIUM</text>
  <text x="600" y="560" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-style="italic" fill="url(#gold)" fill-opacity="0.9">L'impression qui sublime votre marque</text>
</svg>