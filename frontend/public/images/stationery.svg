<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BF953F"/>
      <stop offset="50%" stop-color="#FCF6BA"/>
      <stop offset="100%" stop-color="#B38728"/>
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0e08"/>
      <stop offset="100%" stop-color="#0a0908"/>
    </linearGradient>
    <linearGradient id="card2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <!-- Business cards stacked -->
  <!-- Card shadow layers -->
  <rect x="350" y="255" width="500" height="290" rx="4" fill="#030303"/>
  <rect x="345" y="250" width="500" height="290" rx="4" fill="#060605"/>
  <!-- Main card -->
  <rect x="340" y="240" width="500" height="290" rx="4" fill="url(#card1)" stroke="url(#gold)" stroke-width="1.5"/>
  <!-- Card gold border inner -->
  <rect x="356" y="256" width="468" height="258" rx="2" fill="none" stroke="url(#gold)" stroke-width="0.5" stroke-opacity="0.4"/>
  <!-- Card content -->
  <!-- Logo mark -->
  <g transform="translate(480,330)">
    <circle cx="0" cy="0" r="28" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
    <text x="0" y="8" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-style="italic" fill="url(#gold)">ID</text>
  </g>
  <!-- Name line -->
  <text x="575" y="360" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="url(#gold)">ILLIKO DESIGN</text>
  <text x="575" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#D4AF37" fill-opacity="0.5" letter-spacing="4">IMPRIMERIE &amp; COMMUNICATION VISUELLE</text>
  <!-- Divider line -->
  <line x1="400" y1="420" x2="750" y2="420" stroke="url(#gold)" stroke-width="0.5" stroke-opacity="0.4"/>
  <!-- Contact info lines -->
  <text x="575" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888" letter-spacing="1">+224 611 10 01 60</text>
  <text x="575" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888" letter-spacing="1">Hamdallaye · Conakry</text>
  <!-- Second card offset -->
  <rect x="640" y="300" width="180" height="110" rx="3" fill="url(#card2)" stroke="url(#gold)" stroke-width="0.8" transform="rotate(-15 730 355)"/>
  <!-- Label -->
  <text x="600" y="700" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#D4AF37" fill-opacity="0.5" letter-spacing="5">IDENTITÉ VISUELLE · CARTES · PAPETERIE · LOGOS</text>
</svg>