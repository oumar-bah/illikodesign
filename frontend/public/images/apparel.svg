<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BF953F"/>
      <stop offset="50%" stop-color="#FCF6BA"/>
      <stop offset="100%" stop-color="#B38728"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <!-- T-shirt shape centered -->
  <!-- Left sleeve -->
  <path d="M280,200 L160,280 L200,380 L340,320 Z" fill="url(#shirt)" stroke="#2a2a2a" stroke-width="2"/>
  <!-- Right sleeve -->
  <path d="M920,200 L1040,280 L1000,380 L860,320 Z" fill="url(#shirt)" stroke="#2a2a2a" stroke-width="2"/>
  <!-- Main body -->
  <path d="M280,200 Q340,160 480,145 L520,100 Q600,80 680,100 L720,145 Q860,160 920,200 L860,320 L340,320 Z" fill="url(#shirt)" stroke="#2a2a2a" stroke-width="2"/>
  <rect x="340" y="320" width="520" height="360" rx="0" fill="url(#shirt)" stroke="#2a2a2a" stroke-width="2"/>
  <!-- Collar -->
  <path d="M520,100 Q540,130 600,138 Q660,130 680,100" fill="none" stroke="#3a3a3a" stroke-width="2"/>
  <!-- Printed logo on shirt -->
  <g transform="translate(600, 440)">
    <polygon points="0,-50 43,25 -43,25" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <text x="0" y="14" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="url(#gold)" letter-spacing="1">ID</text>
  </g>
  <text x="600" y="510" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="url(#gold)" fill-opacity="0.7" letter-spacing="4">ILLIKO DESIGN</text>
  <!-- Gold seams -->
  <path d="M340,320 Q600,310 860,320" fill="none" stroke="url(#gold)" stroke-width="0.8" stroke-opacity="0.3"/>
  <!-- Label at bottom -->
  <text x="600" y="730" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#D4AF37" fill-opacity="0.5" letter-spacing="5">TEXTILE PERSONNALISÉ · T-SHIRTS · POLOS · MAILLOTS</text>
</svg>